plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev1'
        }

        // Second client for two-player testing (separate game dir + username).
        client2 {
            client()
            gameDirectory = file('run2')
            programArguments.addAll '--username', 'Dev2'
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // JourneyMap API v2 (new recommended host; the old jm.gserv.me host is kept as a
    // fallback below since JourneyMap still publishes there too, but is less reliable).
    maven {
        name = 'JourneyMapNew'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'JourneyMap'
        url = 'https://jm.gserv.me/repository/maven-public/'
    }
    // Full JourneyMap mod for in-dev runtime testing
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Kotlin for Forge (NeoForge line) - SuperbWarfare (Kotlin-based) needs this language provider present at runtime
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
}

// JourneyMap API 2.0.x is still pre-1.0/actively iterating; re-check for updates every build
// instead of Gradle's default 24h cache, per the API's own setup instructions.
configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    // Compile-time only soft dependency: never shipped, never required at runtime.
    compileOnly group: 'info.journeymap', name: 'journeymap-api-neoforge', version: journeymap_api_version, changing: true

    // JourneyMap 1.21.1-6.0.2+neoforge, for the dev runtime only.
    // Production jars must NOT go into run/mods: this is a runtime-only test copy.
    runtimeOnly 'curse.maven:journeymap-32274:8523102'
    // Required at runtime when JourneyMap is added as a dependency jar rather than
    // dropped into run/mods directly (see the API's setup docs).
    runtimeOnly 'curse.maven:common-network-806044:7087488'

    // TACZ (gun mod) API - compile-time only soft dependency, never shipped or required.
    // Unofficial NeoForge 1.21.1 port (different CurseForge project than the old 1.20.1 TACZ).
    // Unlike the old legacy-Forge TACZ jar, this NeoForge-native port ships already
    // Mojmap-named, so a plain compileOnly/runtimeOnly (no SRG remap) is sufficient.
    compileOnly 'curse.maven:tacz-1-21-1-1353462:8547439'
    // Full TACZ mod for in-dev runtime testing only; do NOT place this jar in run/mods directly.
    runtimeOnly 'curse.maven:tacz-1-21-1-1353462:8547439'

    // SuperbWarfare (gun mod) - the revive guard has no compile-time dependency on it at all
    // (it only checks the vanilla Projectile type + the "superbwarfare" entity namespace), so
    // only a dev-runtime copy is needed here, for testing. Do NOT place this jar in run/mods directly.
    runtimeOnly 'curse.maven:superb-warfare-1218165:8104860'
    // SuperbWarfare is written in Kotlin and needs this language provider (NeoForge line) to load.
    // 5.12.0 is the last kotlinforforge-neoforge release supporting MC 1.21.1 ([1.20.6,1.21.9));
    // 6.x requires MC 1.21.9+.
    runtimeOnly 'thedarkcolour:kotlinforforge-neoforge:5.12.0'
    // SuperbWarfare's own mandatory dependencies (dev-runtime only, for testing).
    runtimeOnly 'curse.maven:geckolib-388172:8350073'
    runtimeOnly 'curse.maven:curios-309927:6529130'
}

tasks.register('printCp') { def cp = sourceSets.main.compileClasspath; doLast { cp.each { println it } } }
